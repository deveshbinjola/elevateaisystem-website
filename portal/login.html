<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cohort Portal Login · ElevateAI</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%2300FF41'/%3E%3Cpath d='M50 20 C35 20 25 35 25 55 C25 75 40 80 50 80 C60 80 75 75 75 55 C75 35 65 20 50 20 Z' fill='%23020802'/%3E%3Cpath d='M50 80 L50 85' stroke='%23020802' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --green:#00FF41; --green-dark:#00CC34; --navy:#0A0F1C; --navy-soft:#1A1F2C;
  --bg:#FAFAF8; --bg-alt:#F2F2EE; --white:#FFFFFF;
  --text:#1A1A2E; --text-muted:#5A5A6E; --border:#E0E0D8;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:linear-gradient(180deg,var(--navy) 0%,#121830 100%);color:var(--white);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1.5rem}
.card{background:var(--white);color:var(--text);border-radius:24px;padding:3rem 2.5rem;max-width:440px;width:100%;box-shadow:0 24px 64px rgba(0,0,0,.3);position:relative;overflow:hidden}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,var(--green) 0%,var(--green-dark) 100%)}
.logo{width:48px;height:48px;border-radius:14px;background:var(--green);display:flex;align-items:center;justify-content:center;margin:0 auto 1.5rem}
.logo svg{width:30px;height:30px}
h1{font-size:1.6rem;font-weight:800;color:var(--navy);text-align:center;margin-bottom:.5rem;letter-spacing:-.02em}
.sub{font-size:.92rem;color:var(--text-muted);text-align:center;margin-bottom:2rem}
label{display:block;font-size:.75rem;font-weight:800;color:var(--navy);letter-spacing:.08em;text-transform:uppercase;margin-bottom:.5rem}
input[type="email"]{width:100%;padding:1rem 1.1rem;border:1.5px solid var(--border);border-radius:12px;font-family:inherit;font-size:1rem;color:var(--text);background:var(--bg);transition:border-color .2s}
input[type="email"]:focus{outline:none;border-color:var(--green);background:var(--white)}
.btn{width:100%;background:var(--green);color:var(--navy);border:none;padding:1rem;border-radius:12px;font-weight:800;font-size:.95rem;cursor:pointer;margin-top:1.5rem;font-family:inherit;transition:all .2s}
.btn:hover{background:var(--green-dark);transform:translateY(-1px);box-shadow:0 8px 24px rgba(0,255,65,.2)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none;box-shadow:none}
.msg{margin-top:1rem;padding:.9rem 1rem;border-radius:10px;font-size:.85rem;text-align:center;display:none}
.msg.ok{display:block;background:#EEFFF4;color:var(--green-dark);border:1px solid var(--green)}
.msg.err{display:block;background:#FED7D7;color:#9B2C2C;border:1px solid #E53E3E}
.foot{margin-top:2rem;text-align:center;font-size:.78rem;color:var(--text-muted)}
.foot a{color:var(--green-dark);font-weight:700}
.notice{background:var(--bg-alt);border-left:3px solid var(--green);padding:.8rem 1rem;border-radius:8px;font-size:.82rem;color:var(--text-muted);margin-top:1.5rem;line-height:1.55}
</style>
</head>
<body>

<div class="card">
  <div class="logo">
    <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <path d="M50 20 C35 20 25 35 25 55 C25 75 40 80 50 80 C60 80 75 75 75 55 C75 35 65 20 50 20 Z" fill="#0A0F1C"/>
      <path d="M50 80 L50 85" stroke="#0A0F1C" stroke-width="4" stroke-linecap="round"/>
    </svg>
  </div>
  <h1>Cohort Portal</h1>
  <p class="sub">For Augmented Coach members. Magic-link login — no passwords.</p>

  <form id="login-form">
    <label for="email">Your cohort email</label>
    <input type="email" id="email" name="email" placeholder="you@yourbrand.com" required autocomplete="email">
    <button type="submit" class="btn" id="submit-btn">Send me a magic link →</button>
  </form>

  <div class="msg" id="msg"></div>

  <div class="notice">
    <b>First time here?</b> Use the email you applied with. If you can't log in, check spam for <code style="font-size:.78rem">noreply@supabase.co</code> — or email <a href="mailto:sunny.binjola@gmail.com" style="color:var(--green-dark)">Sunny</a>.
  </div>

  <div class="foot">
    Not a member yet? <a href="/augmented-coach">See the cohort</a>
  </div>
</div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

const SUPABASE_URL = 'https://modepuhwinzdngirlnkz.supabase.co';
const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1vZGVwdWh3aW56ZG5naXJsbmt6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI1MDYxNTEsImV4cCI6MjA4ODA4MjE1MX0.1S2wC8CxE8_MCTmsGwoiOoqNYw_lXIM7_CT_-AG6DAI';

const supa = createClient(SUPABASE_URL, SUPABASE_ANON);

// If already logged in, redirect to dashboard
(async () => {
  const { data: { session } } = await supa.auth.getSession();
  if (session) window.location.href = '/portal/dashboard';
})();

const form = document.getElementById('login-form');
const msg = document.getElementById('msg');
const btn = document.getElementById('submit-btn');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = document.getElementById('email').value.trim();
  if (!email) return;

  btn.disabled = true;
  btn.textContent = 'Sending magic link…';
  msg.className = 'msg';
  msg.textContent = '';

  const { error } = await supa.auth.signInWithOtp({
    email,
    options: {
      emailRedirectTo: window.location.origin + '/portal/dashboard'
    }
  });

  if (error) {
    msg.className = 'msg err';
    msg.textContent = error.message || 'Something broke. Email Sunny directly.';
    btn.disabled = false;
    btn.textContent = 'Send me a magic link →';
    return;
  }

  msg.className = 'msg ok';
  msg.innerHTML = `Check <b>${email}</b> — magic link sent. Expires in 60 min.`;
  btn.textContent = 'Sent ✓';
});
</script>

</body>
</html>
