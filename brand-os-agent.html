<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Brand OS Blueprint · ElevateAI Systems</title>
<meta name="description" content="The Brand OS Blueprint. A free editorial guide that interviews you and produces your Avatar, Voice, Pillars, Scripts. Runs in your browser.">
<meta name="robots" content="noindex,follow">

<style>
/* GLOBAL MOBILE SAFETY */
html, body { max-width: 100vw; overflow-x: hidden; }
img, svg, video, canvas, iframe { max-width: 100%; height: auto; }
</style>

<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 88 88'%3E%3Crect x='6' y='8' width='72' height='72' rx='18' fill='%2300F33D'/%3E%3Cpath d='M26 56C24.9 44.1 27.9 34.6 36.5 28.8C43 24.4 50.8 24.8 58.8 18.9C62.2 34.2 58 47.3 47.1 53.2C40.1 57 33 56.7 28.2 54.7L26 56Z' fill='%23071126'/%3E%3Cpath d='M24.4 58.9C28.8 49.3 36.1 42.1 46.2 36.9' stroke='%23071126' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"></noscript>

<style>
  :root{
    --navy:#0A0F1C;--navy-light:#1A2035;
    --green:#00FF41;--green-dark:#00CC34;
    --bg:#FAFAF8;--bg-alt:#F2F2EE;
    --text:#1A1A2E;--muted:#5A5A6E;
    --border:#E0E0D8;--white:#FFFFFF;
    --danger:#C1282B;
    --font:'Plus Jakarta Sans',system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--font);line-height:1.55;-webkit-font-smoothing:antialiased}
  body{display:flex;flex-direction:column;min-height:100vh}

  /* TOPBAR */
  .topbar{padding:14px 20px;border-bottom:1px solid var(--border);background:var(--white);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10;gap:12px;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:10px;font-weight:800;color:var(--navy);font-size:.92rem;letter-spacing:-.01em;text-decoration:none}
  .brand svg{width:22px;height:22px;color:var(--green-dark)}
  .brand small{display:block;font-size:.62rem;font-weight:600;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-top:2px}
  .topbar-actions{display:flex;gap:8px;align-items:center}
  .topbar-actions button{font-family:var(--font);font-size:.72rem;font-weight:700;padding:8px 14px;border:1px solid var(--border);background:var(--white);color:var(--navy);border-radius:8px;cursor:pointer;letter-spacing:.02em;transition:all .15s}
  .topbar-actions button:hover{background:var(--bg-alt);border-color:var(--navy)}
  .topbar-actions button.primary{background:var(--navy);color:var(--white);border-color:var(--navy)}
  .topbar-actions button.primary:hover{background:var(--navy-light)}
  .topbar-actions button.success{background:var(--green);color:var(--navy);border-color:var(--green);font-weight:800}
  .topbar-actions button.success:hover{background:var(--green-dark);border-color:var(--green-dark)}
  .topbar-actions button.danger:hover{color:var(--danger);border-color:var(--danger);background:rgba(193,40,43,.04)}

  /* MAIN CHAT */
  .chat{flex:1;display:flex;flex-direction:column;overflow:hidden;position:relative}
  .messages{flex:1;overflow-y:auto;padding:28px 20px 140px;scroll-behavior:smooth;-webkit-overflow-scrolling:touch}
  .messages-inner{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:16px}

  /* MESSAGE BUBBLES */
  .msg{display:flex;gap:12px;align-items:flex-start;max-width:100%;animation:fadeUp .3s ease}
  @keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
  .msg.user{flex-direction:row-reverse}
  .msg-avatar{width:32px;height:32px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:.65rem;font-weight:800;letter-spacing:.02em}
  .msg.agent .msg-avatar{background:var(--navy);color:var(--green);border:2px solid var(--green)}
  .msg.user .msg-avatar{background:var(--bg-alt);color:var(--navy);border:1px solid var(--border)}
  .msg-bubble{padding:14px 18px;border-radius:14px;font-size:.95rem;line-height:1.6;max-width:calc(100% - 52px)}
  .msg.agent .msg-bubble{background:var(--white);border:1px solid var(--border);color:var(--text);border-top-left-radius:6px}
  .msg.user .msg-bubble{background:var(--navy);color:var(--white);border-top-right-radius:6px}
  .msg-bubble b, .msg-bubble strong{color:var(--navy);font-weight:700}
  .msg.user .msg-bubble b, .msg.user .msg-bubble strong{color:var(--green)}
  .msg-bubble p{margin:0 0 10px}
  .msg-bubble p:last-child{margin-bottom:0}
  .msg-bubble em{color:inherit;font-style:italic;opacity:.85}
  .msg-bubble ul, .msg-bubble ol{padding-left:22px;margin:8px 0}
  .msg-bubble li{margin-bottom:4px}
  .msg-bubble code{background:rgba(10,15,28,.06);padding:1px 6px;border-radius:4px;font-family:ui-monospace,SFMono-Regular,monospace;font-size:.88em}
  .msg.user .msg-bubble code{background:rgba(255,255,255,.12);color:var(--green)}
  .msg-bubble pre{background:var(--bg-alt);padding:12px 14px;border-radius:8px;overflow-x:auto;font-size:.82rem;margin:8px 0}
  .msg.user .msg-bubble pre{background:rgba(255,255,255,.08);color:var(--white)}
  .msg-bubble blockquote{border-left:3px solid var(--green-dark);padding-left:12px;margin:8px 0;color:var(--muted);font-style:italic}

  /* TYPING INDICATOR */
  .typing{display:flex;gap:4px;padding:4px 2px;align-items:center;height:20px}
  .typing span{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:typing 1.4s ease-in-out infinite}
  .typing span:nth-child(2){animation-delay:.2s}
  .typing span:nth-child(3){animation-delay:.4s}
  @keyframes typing{0%,60%,100%{opacity:.3;transform:translateY(0)}30%{opacity:1;transform:translateY(-4px)}}

  /* INPUT BAR */
  .input-bar{position:fixed;bottom:0;left:0;right:0;background:linear-gradient(to top,var(--bg) 70%,rgba(250,250,248,0));padding:20px 20px 22px;z-index:5}
  .input-bar-inner{max-width:760px;margin:0 auto;display:flex;gap:10px;align-items:flex-end}
  .input-wrap{flex:1;background:var(--white);border:1.5px solid var(--border);border-radius:14px;transition:border-color .15s;box-shadow:0 4px 20px rgba(10,15,28,.06);overflow:hidden}
  .input-wrap:focus-within{border-color:var(--navy)}
  .input-wrap textarea{width:100%;border:none;padding:14px 16px;font-family:var(--font);font-size:.95rem;line-height:1.5;background:transparent;color:var(--text);resize:none;max-height:180px;min-height:24px;display:block}
  .input-wrap textarea:focus{outline:none}
  .input-wrap textarea::placeholder{color:var(--muted);opacity:.6}
  .send-btn{width:48px;height:48px;background:var(--navy);color:var(--white);border:none;border-radius:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;flex-shrink:0;align-self:flex-end}
  .send-btn:hover:not(:disabled){background:var(--navy-light);transform:translateY(-1px)}
  .send-btn:disabled{opacity:.4;cursor:not-allowed}
  .send-btn svg{width:20px;height:20px}
  .input-hint{text-align:center;font-size:.68rem;color:var(--muted);margin-top:8px;letter-spacing:.02em}

  /* ERROR */
  .error-banner{background:rgba(193,40,43,.08);border:1px solid rgba(193,40,43,.2);border-radius:10px;padding:12px 16px;margin:10px 0;color:var(--danger);font-size:.82rem;display:none}
  .error-banner.active{display:block}

  /* MOBILE */
  @media(max-width:640px){
    .topbar{padding:12px 14px}
    .brand{font-size:.85rem}
    .topbar-actions button{font-size:.68rem;padding:7px 11px}
    .messages{padding:20px 14px 140px}
    .input-bar{padding:16px 14px 18px}
  }

  /* PRINT (for exporting) */
  @media print {
    .topbar, .input-bar{display:none}
    .messages{padding:20px;overflow:visible}
    body{height:auto}
  }
</style>
</head>
<body>

<!-- TOPBAR -->
<header class="topbar">
  <a href="/" class="brand">
    <svg viewBox="0 0 48 48" fill="none" aria-hidden="true"><rect x="3" y="4" width="39" height="39" rx="9.8" fill="#00F33D"/><path d="M14.2 30.5C13.6 24 15.2 18.8 19.9 15.6C23.5 13.2 27.7 13.4 32.1 10.2C33.9 18.5 31.6 25.6 25.7 28.8C21.9 30.9 18 30.7 15.4 29.6L14.2 30.5Z" fill="#071126"/><path d="M13.4 32.1C15.8 26.9 19.8 22.9 25.3 20.1" stroke="#071126" stroke-width="2.7" stroke-linecap="round"/></svg>
    <span>ElevateAI<small>The Brand OS Blueprint · Free</small></span>
  </a>
  <div class="topbar-actions">
    <button type="button" id="importBtn" class="success" title="Import the Voice section into Coach App">Import Voice</button>
    <button type="button" id="exportBtn" title="Export this session as a Markdown file">Export</button>
    <button type="button" id="clearBtn" class="danger" title="Clear the session and start fresh">Clear</button>
  </div>
</header>

<!-- CHAT -->
<main class="chat">
  <div class="messages" id="messages">
    <div class="messages-inner" id="messagesInner">
      <!-- Messages will be rendered here -->
    </div>
  </div>

  <!-- INPUT -->
  <div class="input-bar">
    <div class="input-bar-inner">
      <div class="error-banner" id="errorBanner"></div>
    </div>
    <div class="input-bar-inner">
      <div class="input-wrap">
        <textarea id="inputEl" placeholder="Your answer…" rows="1" autofocus></textarea>
      </div>
      <button type="button" id="sendBtn" class="send-btn" title="Send (Enter)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
      </button>
    </div>
    <div class="input-hint">Press <b>Enter</b> to send · <b>Shift+Enter</b> for newline · Session auto-saves to your browser</div>
  </div>
</main>

<script>
(function(){
  // ============================================
  // Config
  // ============================================
  const API_ENDPOINT = '/api/chat';
  const STORAGE_KEY = 'bos-agent-session-v1';
  const API_KEY_STORAGE = 'bos-coach-app-api-key-v1';
  const COACH_APP_VOICE_ENDPOINT = 'https://app.elevateaisystem.com/api/v1/voice';

  // The agent's pre-rendered opening message (also lives in the system prompt
  // so the model knows what it "said" when the user replies).
  const OPENING = `Hey, this is the Brand OS Blueprint. We're going to build your Avatar, Voice, Pillars, and Scripts. By the end you'll have one document that makes every future content/lead/sales decision easier.

**Two ways to run this:**

1. **Full session (60-90 min)**, All four modules, back to back. Best if you have a quiet morning.
2. **Module-at-a-time**, Tell me which one first. Pick it up later where you left off.

Also, before we start, are you a coach, consultant, creator, or something else? And roughly what's your monthly revenue? (This calibrates how I probe. No judgment either way.)`;

  // ============================================
  // State
  // ============================================
  let history = []; // [{role:'user'|'assistant', content:string}]
  let sending = false;

  const messagesEl = document.getElementById('messages');
  const messagesInnerEl = document.getElementById('messagesInner');
  const inputEl = document.getElementById('inputEl');
  const sendBtn = document.getElementById('sendBtn');
  const errorBanner = document.getElementById('errorBanner');
  const exportBtn = document.getElementById('exportBtn');
  const importBtn = document.getElementById('importBtn');
  const clearBtn = document.getElementById('clearBtn');

  // ============================================
  // Markdown-lite renderer for agent messages
  // ============================================
  function escapeHtml(s){
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  function renderMarkdown(text){
    let html = escapeHtml(text);
    // Code blocks ```...```
    html = html.replace(/```([\s\S]*?)```/g, (_,c) => `<pre>${c.trim()}</pre>`);
    // Inline code
    html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
    // Bold **x**
    html = html.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    // Italic *x*
    html = html.replace(/(^|[^*])\*([^*]+)\*(?!\*)/g, '$1<em>$2</em>');
    // Blockquotes > x
    html = html.replace(/(?:^|\n)&gt; (.+)/g, '\n<blockquote>$1</blockquote>');
    // Numbered lists
    html = html.replace(/(?:^|\n)(\d+\. .+(?:\n\d+\. .+)*)/g, (m, block) => {
      const items = block.split('\n').map(l => l.replace(/^\d+\. /, '').trim()).filter(Boolean);
      return '\n<ol>' + items.map(i => `<li>${i}</li>`).join('') + '</ol>';
    });
    // Bulleted lists
    html = html.replace(/(?:^|\n)(- .+(?:\n- .+)*)/g, (m, block) => {
      const items = block.split('\n').map(l => l.replace(/^- /, '').trim()).filter(Boolean);
      return '\n<ul>' + items.map(i => `<li>${i}</li>`).join('') + '</ul>';
    });
    // Paragraphs (double newlines)
    html = html.split(/\n\n+/).map(p => {
      if (p.startsWith('<') ) return p;
      return '<p>' + p.replace(/\n/g, '<br>') + '</p>';
    }).join('\n');
    return html;
  }

  function addMessage(role, content, skipRender){
    history.push({ role, content });
    if (!skipRender) renderMessage(role, content);
    saveSession();
  }

  function renderMessage(role, content){
    const msg = document.createElement('div');
    msg.className = 'msg ' + role;
    const avatar = document.createElement('div');
    avatar.className = 'msg-avatar';
    avatar.textContent = role === 'user' ? 'You' : 'BOS';
    const bubble = document.createElement('div');
    bubble.className = 'msg-bubble';
    bubble.innerHTML = role === 'assistant' ? renderMarkdown(content) : escapeHtml(content).replace(/\n/g,'<br>');
    msg.appendChild(avatar);
    msg.appendChild(bubble);
    messagesInnerEl.appendChild(msg);
    scrollToBottom();
  }

  function showTyping(){
    const msg = document.createElement('div');
    msg.className = 'msg agent';
    msg.id = 'typingMsg';
    msg.innerHTML = `<div class="msg-avatar">BOS</div><div class="msg-bubble"><div class="typing"><span></span><span></span><span></span></div></div>`;
    messagesInnerEl.appendChild(msg);
    scrollToBottom();
  }
  function hideTyping(){
    const el = document.getElementById('typingMsg');
    if (el) el.remove();
  }

  function scrollToBottom(){
    requestAnimationFrame(() => {
      messagesEl.scrollTop = messagesEl.scrollHeight;
    });
  }

  function showError(text){
    errorBanner.textContent = text;
    errorBanner.classList.add('active');
    setTimeout(() => errorBanner.classList.remove('active'), 6000);
  }

  function showNotice(text){
    errorBanner.textContent = text;
    errorBanner.classList.add('active');
    setTimeout(() => errorBanner.classList.remove('active'), 6000);
  }

  // ============================================
  // Session persistence
  // ============================================
  function saveSession(){
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(history));
    } catch(e) { /* ignore quota issues */ }
  }
  function loadSession(){
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return null;
      const parsed = JSON.parse(raw);
      if (Array.isArray(parsed) && parsed.length > 0) return parsed;
    } catch(e) {}
    return null;
  }
  function clearSession(){
    if (!confirm('Clear this session and start over? This cannot be undone.')) return;
    localStorage.removeItem(STORAGE_KEY);
    history = [];
    messagesInnerEl.innerHTML = '';
    initOpening();
  }

  // ============================================
  // Init, render opening + any saved session
  // ============================================
  function initOpening(){
    if (history.length === 0) {
      addMessage('assistant', OPENING);
    }
  }
  function renderAll(){
    messagesInnerEl.innerHTML = '';
    history.forEach(m => renderMessage(m.role, m.content));
  }

  const saved = loadSession();
  if (saved) {
    history = saved;
    renderAll();
  } else {
    initOpening();
  }

  // ============================================
  // Send message
  // ============================================
  async function sendMessage(){
    if (sending) return;
    const text = inputEl.value.trim();
    if (!text) return;

    inputEl.value = '';
    inputEl.style.height = 'auto';
    addMessage('user', text);

    sending = true;
    sendBtn.disabled = true;
    showTyping();

    try {
      const resp = await fetch(API_ENDPOINT, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages: history })
      });

      hideTyping();

      if (!resp.ok) {
        const errText = await resp.text().catch(() => resp.statusText);
        showError(`Request failed (${resp.status}). ${errText}`);
        sending = false;
        sendBtn.disabled = false;
        return;
      }

      const data = await resp.json();
      const reply = data.content || data.message || data.reply || '';
      if (!reply) {
        showError('Empty response from the agent. Try again.');
      } else {
        addMessage('assistant', reply);
      }
    } catch(err) {
      hideTyping();
      showError('Network error. Check your connection and try again.');
      console.error(err);
    }

    sending = false;
    sendBtn.disabled = false;
    inputEl.focus();
  }

  // ============================================
  // Input handling
  // ============================================
  inputEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });
  inputEl.addEventListener('input', () => {
    // Auto-resize
    inputEl.style.height = 'auto';
    inputEl.style.height = Math.min(inputEl.scrollHeight, 180) + 'px';
  });
  sendBtn.addEventListener('click', sendMessage);

  // ============================================
  // Export as Markdown
  // ============================================
  exportBtn.addEventListener('click', () => {
    const date = new Date().toISOString().slice(0, 10);
    let md = `# Brand OS Agent Session\n*Exported ${date}*\n\n---\n\n`;
    history.forEach(m => {
      const who = m.role === 'user' ? '**You**' : '**Brand OS Agent**';
      md += `${who}:\n\n${m.content}\n\n---\n\n`;
    });
    const blob = new Blob([md], { type: 'text/markdown' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `brand-os-session-${date}.md`;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 100);
  });

  // ============================================
  // Import Voice into Coach App
  // ============================================
  importBtn.addEventListener('click', importVoiceToCoachApp);

  async function importVoiceToCoachApp(){
    const latest = [...history].reverse().find(m =>
      m.role === 'assistant' &&
      m.content.includes('## 2. Voice') &&
      m.content.includes('**Position on 4 axes:**')
    );

    if (!latest) {
      showError('No finished Brand OS document found yet. Finish the session first, then import.');
      return;
    }

    const voice = extractVoiceProfile(latest.content);
    if (!voice) {
      showError('Could not read the Voice section. Export the session and import manually from Coach App.');
      return;
    }

    const savedKey = localStorage.getItem(API_KEY_STORAGE) || '';
    const apiKey = prompt('Paste your Coach App write API key. It starts with cp_live_.', savedKey);
    if (!apiKey) return;
    if (!/^cp_live_[a-f0-9]+$/i.test(apiKey.trim())) {
      showError('That does not look like a Coach App API key.');
      return;
    }
    localStorage.setItem(API_KEY_STORAGE, apiKey.trim());

    importBtn.disabled = true;
    importBtn.textContent = 'Importing...';

    try {
      const resp = await fetch(COACH_APP_VOICE_ENDPOINT, {
        method: 'POST',
        headers: {
          'Authorization': `Bearer ${apiKey.trim()}`,
          'Content-Type': 'application/json',
        },
        body: JSON.stringify({
          voice_json: voice,
          sample_messages: extractWritingSamples(latest.content),
        }),
      });

      const text = await resp.text();
      let payload = {};
      try { payload = JSON.parse(text); } catch(e) {}

      if (!resp.ok) {
        showError(payload.error || `Import failed (${resp.status}).`);
        return;
      }

      const version = payload.voice && payload.voice.version ? ` v${payload.voice.version}` : '';
      showNotice(`Voice imported into Coach App${version}. Future drafts will use it.`);
    } catch(err) {
      console.error(err);
      showError('Import failed. Check the API key and Coach App endpoint.');
    } finally {
      importBtn.disabled = false;
      importBtn.textContent = 'Import Voice';
    }
  }

  function extractVoiceProfile(markdown){
    const sectionMatch = markdown.match(/## 2\. Voice([\s\S]*?)(?:\n---\n|\n## 3\.|$)/);
    const section = sectionMatch ? sectionMatch[1] : '';
    if (!section) return null;

    const axes = {
      formal_casual: readAxis(section, 'Formal'),
      serious_playful: readAxis(section, 'Serious'),
      analytical_emotional: readAxis(section, 'Analytical'),
      direct_nuanced: readAxis(section, 'Direct'),
    };

    const vocabularyUse = readListLine(section, 'Your vocabulary');
    const vocabularyAvoid = readListLine(section, 'Anti-vocabulary');
    const adjectives = readListLine(section, 'Voice in 3 adjectives');

    return {
      tone: adjectives.length ? adjectives : ['direct', 'warm'],
      sentence_rhythm: inferRhythmFromAxes(axes),
      vocabulary: {
        use: vocabularyUse,
        avoid: vocabularyAvoid,
      },
      openers: [],
      closers: [],
      ctas: [],
      emotional_register: inferRegisterFromAxes(axes, adjectives),
      do_nots: vocabularyAvoid.map(word => `Do not use "${word}"`),
      brand_os_axes: axes,
      source: 'brand_os_agent',
    };
  }

  function readAxis(section, label){
    const match = section.match(new RegExp(`${label}[^:]*:\\s*\\*\\*(\\d+)\\/10\\*\\*`, 'i'));
    return match ? Number(match[1]) : null;
  }

  function readListLine(section, label){
    const escaped = label.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    const match = section.match(new RegExp(`\\*\\*${escaped}[^:]*:\\*\\*\\s*([^\\n]+)`, 'i'));
    if (!match) return [];
    return match[1]
      .replace(/[\\[\\]]/g, '')
      .split(/,|·|;/)
      .map(s => s.trim().replace(/^["']|["']$/g, ''))
      .filter(Boolean)
      .slice(0, 12);
  }

  function inferRhythmFromAxes(axes){
    const direct = axes.direct_nuanced;
    const emotional = axes.analytical_emotional;
    if (direct !== null && direct >= 7) return 'direct, clear, low-fluff sentences with a clean next step';
    if (emotional !== null && emotional >= 7) return 'emotion-forward, reflective, and grounded in lived language';
    return 'balanced, conversational, and specific';
  }

  function inferRegisterFromAxes(axes, adjectives){
    const parts = [];
    if (axes.serious_playful !== null) parts.push(axes.serious_playful >= 6 ? 'playful' : 'serious');
    if (axes.analytical_emotional !== null) parts.push(axes.analytical_emotional >= 6 ? 'emotional' : 'analytical');
    if (axes.direct_nuanced !== null) parts.push(axes.direct_nuanced >= 6 ? 'direct' : 'nuanced');
    return [...parts, ...adjectives].filter(Boolean).slice(0, 6).join(', ') || 'clear and grounded';
  }

  function extractWritingSamples(markdown){
    const samples = [];
    const voiceSection = markdown.match(/## 2\. Voice([\s\S]*?)(?:\n---\n|\n## 3\.|$)/);
    if (voiceSection) samples.push(voiceSection[1].trim());
    const scriptsSection = markdown.match(/## 4\. Scripts([\s\S]*?)(?:\n---\n|\n## What to do next|$)/);
    if (scriptsSection) samples.push(scriptsSection[1].trim());
    return samples.filter(s => s.length > 20).slice(0, 5);
  }

  clearBtn.addEventListener('click', clearSession);
})();
</script>
